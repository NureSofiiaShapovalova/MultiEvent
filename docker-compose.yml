services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventflow}
      POSTGRES_USER: ${POSTGRES_USER:-eventflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventflow_dev_password}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - eventflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "${MAILPIT_UI_HOST_PORT:-8025}:8025"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: eventflow-app:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      EVENTFLOW_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-eventflow}
      EVENTFLOW_DB_USERNAME: ${POSTGRES_USER:-eventflow}
      EVENTFLOW_DB_PASSWORD: ${POSTGRES_PASSWORD:-eventflow_dev_password}
      EVENTFLOW_MAIL_HOST: mailpit
      EVENTFLOW_MAIL_PORT: 1025
      EVENTFLOW_MAIL_USERNAME: ${EVENTFLOW_MAIL_USERNAME:-}
      EVENTFLOW_MAIL_PASSWORD: ${EVENTFLOW_MAIL_PASSWORD:-}
      EVENTFLOW_MAIL_FROM: ${EVENTFLOW_MAIL_FROM:-no-reply@eventflow.local}
      EVENTFLOW_MAIL_SMTP_AUTH: "false"
      EVENTFLOW_MAIL_SMTP_STARTTLS: "false"
      EVENTFLOW_PAYMENT_PROVIDER: ${EVENTFLOW_PAYMENT_PROVIDER:-local}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_CURRENCY: ${PAYPAL_CURRENCY:-EUR}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:8082}
    ports:
      - "${APP_HOST_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles:
      - tools
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@nure-eventflow.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change_me_pgadmin_password}
    ports:
      - "${PGADMIN_HOST_PORT:-5050}:80"

volumes:
  eventflow_postgres_data:
