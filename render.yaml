services:
  - type: web
    name: nure-eventflow
    runtime: docker
    region: frankfurt
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: eventflow-db
          property: connectionString
      - key: EVENTFLOW_MAIL_HOST
        sync: false
      - key: EVENTFLOW_MAIL_PORT
        value: "587"
      - key: EVENTFLOW_MAIL_USERNAME
        sync: false
      - key: EVENTFLOW_MAIL_PASSWORD
        sync: false
      - key: EVENTFLOW_MAIL_FROM
        sync: false
      - key: EVENTFLOW_MAIL_SMTP_AUTH
        value: "true"
      - key: EVENTFLOW_MAIL_SMTP_STARTTLS
        value: "true"
      - key: EVENTFLOW_PAYMENT_PROVIDER
        value: local
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CURRENCY
        value: EUR
      - key: APP_PUBLIC_BASE_URL
        sync: false

databases:
  - name: eventflow-db
    databaseName: eventflow
    user: eventflow
    region: frankfurt
