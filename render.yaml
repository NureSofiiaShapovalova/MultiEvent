services:
  - type: web
    name: nure-multievent
    runtime: docker
    region: frankfurt
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: multievent-db
          property: connectionString
      - key: MULTIEVENT_MAIL_HOST
        sync: false
      - key: MULTIEVENT_MAIL_PORT
        value: "587"
      - key: MULTIEVENT_MAIL_USERNAME
        sync: false
      - key: MULTIEVENT_MAIL_PASSWORD
        sync: false
      - key: MULTIEVENT_MAIL_FROM
        sync: false
      - key: MULTIEVENT_MAIL_SMTP_AUTH
        value: "true"
      - key: MULTIEVENT_MAIL_SMTP_STARTTLS
        value: "true"
      - key: MULTIEVENT_PAYMENT_PROVIDER
        value: paypal
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_CURRENCY
        value: EUR
      - key: APP_PUBLIC_BASE_URL
        sync: false

databases:
  - name: multievent-db
    databaseName: multievent
    user: multievent
    region: frankfurt
