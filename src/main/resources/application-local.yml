server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: ${MULTIEVENT_DB_URL:jdbc:postgresql://localhost:5432/multievent}
    username: ${MULTIEVENT_DB_USERNAME:postgres}
    password: ${MULTIEVENT_DB_PASSWORD:postgres}
  mail:
    host: ${MULTIEVENT_MAIL_HOST:localhost}
    port: ${MULTIEVENT_MAIL_PORT:1025}
    username: ${MULTIEVENT_MAIL_USERNAME:}
    password: ${MULTIEVENT_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  jpa:
    show-sql: false

multievent:
  mail:
    from: ${MULTIEVENT_MAIL_FROM:no-reply@multievent.local}

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
