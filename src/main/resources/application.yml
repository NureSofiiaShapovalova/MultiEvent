spring:
  application:
    name: eventflow
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false

server:
  port: ${SERVER_PORT:${PORT:8080}}

eventflow:
  demo:
    enabled: ${EVENTFLOW_DEMO_DATA_ENABLED:true}
    admin-email: ${EVENTFLOW_DEMO_ADMIN_EMAIL:admin@nure-eventflow.local}
    admin-password: ${EVENTFLOW_DEMO_ADMIN_PASSWORD:admin12345}
    organizer-email: ${EVENTFLOW_DEMO_ORGANIZER_EMAIL:organizer@nure-eventflow.local}
    organizer-password: ${EVENTFLOW_DEMO_ORGANIZER_PASSWORD:organizer12345}
    user-email: ${EVENTFLOW_DEMO_USER_EMAIL:user@nure-eventflow.local}
    user-password: ${EVENTFLOW_DEMO_USER_PASSWORD:user12345}
  reporting:
    default-currency: ${EVENTFLOW_REPORTING_DEFAULT_CURRENCY:${PAYPAL_CURRENCY:EUR}}
  payment:
    provider: ${EVENTFLOW_PAYMENT_PROVIDER:local}
    paypal:
      mode: ${PAYPAL_MODE:sandbox}
      client-id: ${PAYPAL_CLIENT_ID:}
      client-secret: ${PAYPAL_CLIENT_SECRET:}
      webhook-id: ${PAYPAL_WEBHOOK_ID:}
      currency: ${PAYPAL_CURRENCY:EUR}
      public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8081}
