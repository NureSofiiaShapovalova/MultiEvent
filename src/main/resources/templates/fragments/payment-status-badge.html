<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="paymentStatusBadge(status)">
<body>
<span class="badge multievent-status"
      th:classappend="${status == 'PAID'} ? 'multievent-status-success' : (${status == 'FAILED'} ? 'multievent-status-danger' : 'multievent-status-warning')"
      th:text="${status}">
    Status
</span>
</body>
</html>
