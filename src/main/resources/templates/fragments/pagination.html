<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="pagination(events, searchForm)">
<body>
<nav th:if="${events.totalPages > 1}" aria-label="Event pages">
    <ul class="pagination justify-content-center flex-wrap gap-1">
        <li class="page-item" th:classappend="${events.first} ? 'disabled'">
            <a class="page-link" th:href="@{/events(page=${events.number - 1}, size=${events.size}, keyword=${searchForm.keyword}, categoryId=${searchForm.categoryId}, city=${searchForm.city}, dateFrom=${searchForm.dateFrom}, dateTo=${searchForm.dateTo}, sort=${searchForm.sort})}">Previous</a>
        </li>
        <li class="page-item" th:each="pageIndex : ${#numbers.sequence(0, events.totalPages - 1)}" th:classappend="${pageIndex == events.number} ? 'active'">
            <a class="page-link" th:href="@{/events(page=${pageIndex}, size=${events.size}, keyword=${searchForm.keyword}, categoryId=${searchForm.categoryId}, city=${searchForm.city}, dateFrom=${searchForm.dateFrom}, dateTo=${searchForm.dateTo}, sort=${searchForm.sort})}" th:attr="aria-current=${pageIndex == events.number} ? 'page' : null" th:text="${pageIndex + 1}">1</a>
        </li>
        <li class="page-item" th:classappend="${events.last} ? 'disabled'">
            <a class="page-link" th:href="@{/events(page=${events.number + 1}, size=${events.size}, keyword=${searchForm.keyword}, categoryId=${searchForm.categoryId}, city=${searchForm.city}, dateFrom=${searchForm.dateFrom}, dateTo=${searchForm.dateTo}, sort=${searchForm.sort})}">Next</a>
        </li>
    </ul>
</nav>
</body>
</html>
