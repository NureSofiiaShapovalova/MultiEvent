<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:fragment="navbar">
<body>
<nav class="navbar navbar-expand-lg sticky-top multievent-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
            <span class="multievent-brand-mark" aria-hidden="true">E</span>
            <span>MultiEvent</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#multieventNavbar"
                aria-controls="multieventNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="multieventNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}" sec:authorize="permitAll" th:text="#{nav.home}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/events}" sec:authorize="permitAll" th:text="#{nav.events}">Events</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/orders}" th:text="#{nav.orders}">Orders</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ORGANIZER')">
                    <a class="nav-link" th:href="@{/organizer/dashboard}" th:text="#{nav.organizer}">Organizer</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ORGANIZER')">
                    <a class="nav-link" th:href="@{/organizer/reports}" th:text="#{nav.organizerReports}">Organizer reports</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin}" th:text="#{nav.admin}">Admin</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/reports}" th:text="#{nav.adminReports}">Admin reports</a>
                </li>
            </ul>

            <div class="d-flex flex-column flex-lg-row align-items-lg-center multievent-navbar-actions">
                <div class="dropdown multievent-language-switcher">
                    <button class="btn btn-sm btn-outline-secondary dropdown-toggle"
                            type="button"
                            data-bs-toggle="dropdown"
                            aria-expanded="false"
                            th:aria-label="#{nav.language.current}"
                            th:text="${#locale.language == 'uk'} ? 'UA' : (${#locale.language == 'de'} ? 'DE' : 'EN')">
                        EN
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="?lang=en" th:classappend="${#locale.language == 'en'} ? ' active'" th:text="#{nav.language.en}">English</a></li>
                        <li><a class="dropdown-item" href="?lang=uk" th:classappend="${#locale.language == 'uk'} ? ' active'" th:text="#{nav.language.uk}">Українська</a></li>
                        <li><a class="dropdown-item" href="?lang=de" th:classappend="${#locale.language == 'de'} ? ' active'" th:text="#{nav.language.de}">Deutsch</a></li>
                    </ul>
                </div>
                <a class="btn btn-sm btn-outline-primary" th:href="@{/profile}" sec:authorize="isAuthenticated()" th:text="#{nav.profile}">Profile</a>
                <a class="btn btn-sm btn-primary" th:href="@{/login}" sec:authorize="isAnonymous()" th:text="#{nav.login}">Login</a>
                <a class="btn btn-sm btn-outline-primary" th:href="@{/register}" sec:authorize="isAnonymous()" th:text="#{nav.register}">Register</a>
                <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-sm btn-outline-danger" th:text="#{nav.logout}">Logout</button>
                </form>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
