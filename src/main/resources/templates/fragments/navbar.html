<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:fragment="navbar">
<body>
<nav class="navbar navbar-expand-lg sticky-top eventflow-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
            <span class="eventflow-brand-mark" aria-hidden="true">E</span>
            <span>EventFlow</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#eventflowNavbar"
                aria-controls="eventflowNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="eventflowNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}" sec:authorize="permitAll">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/events}" sec:authorize="permitAll">Events</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/orders}">Orders</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ORGANIZER')">
                    <a class="nav-link" th:href="@{/organizer/dashboard}">Organizer</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ORGANIZER')">
                    <a class="nav-link" th:href="@{/organizer/reports}">Organizer reports</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin}">Admin</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/reports}">Admin reports</a>
                </li>
            </ul>

            <div class="d-flex flex-column flex-lg-row align-items-lg-center eventflow-navbar-actions">
                <a class="btn btn-sm btn-outline-primary" th:href="@{/profile}" sec:authorize="isAuthenticated()">Profile</a>
                <a class="btn btn-sm btn-primary" th:href="@{/login}" sec:authorize="isAnonymous()">Login</a>
                <a class="btn btn-sm btn-outline-primary" th:href="@{/register}" sec:authorize="isAnonymous()">Register</a>
                <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Logout</button>
                </form>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
