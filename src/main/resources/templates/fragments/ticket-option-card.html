<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="ticketOptionCard(ticketOption, eventSlug)">
<body>
<div class="multievent-ticket-card p-3 h-100">
    <div class="d-flex justify-content-between gap-3 align-items-start mb-2">
        <div>
            <div class="fw-bold" th:text="${ticketOption.name()}">Ticket name</div>
            <div class="multievent-muted small" th:text="${ticketOption.description()}">Description</div>
        </div>
        <span class="badge multievent-status"
              th:classappend="${ticketOption.purchasable()} ? 'multievent-status-success' : 'multievent-status-muted'"
              th:text="${ticketOption.availabilityLabel()}">Label</span>
    </div>
    <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="h5 mb-0 multievent-ticket-price" th:text="${ticketOption.price() + ' ' + ticketOption.currency()}">Price</div>
        <div class="multievent-muted small" th:text="${'Available: ' + ticketOption.availableQuantity()}">Available</div>
    </div>
    <div class="multievent-muted small" th:text="${'Max per order: ' + ticketOption.maxPerOrder()}">Max per order</div>
    <div class="mt-3" th:if="${ticketOption.purchasable()}">
        <a class="btn btn-primary btn-sm w-100" th:href="@{/events/{slug}/checkout(slug=${eventSlug})}">Checkout</a>
    </div>
</div>
</body>
</html>
