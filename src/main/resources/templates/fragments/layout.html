<!doctype html>
<html lang="en"
      th:lang="${#locale.language}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(pageTitle, content)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${pageTitle}">MultiEvent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/multievent.css}" rel="stylesheet">
</head>
<body class="multievent-body">
<a class="multievent-skip-link btn btn-primary btn-sm" href="#main-content" th:text="#{layout.skipToContent}">Skip to content</a>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main id="main-content" class="container multievent-main" tabindex="-1">
    <div th:replace="~{fragments/messages :: messages}"></div>
    <div th:replace="${content}"></div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
