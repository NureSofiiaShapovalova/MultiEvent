<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="filterForm(searchForm, categories)">
<body>
<form th:action="@{/events}" th:object="${searchForm}" method="get" class="bg-white border rounded-4 shadow-sm p-3 p-md-4 mb-4">
    <div class="row g-3 align-items-end">
    <div class="col-lg-4 col-md-6">
        <label class="form-label fw-semibold" for="keyword">Keyword</label>
        <input id="keyword" type="text" th:field="*{keyword}" class="form-control form-control-lg" placeholder="Search events">
    </div>
    <div class="col-lg-3 col-md-6">
        <label class="form-label fw-semibold" for="categoryId">Category</label>
        <select id="categoryId" th:field="*{categoryId}" class="form-select form-select-lg">
            <option value="">All categories</option>
            <option th:each="category : ${categories}" th:value="${category.id()}" th:text="${category.name()}">Category</option>
        </select>
    </div>
    <div class="col-lg-2 col-md-4">
        <label class="form-label fw-semibold" for="city">City</label>
        <input id="city" type="text" th:field="*{city}" class="form-control form-control-lg" placeholder="City">
    </div>
    <div class="col-lg-2 col-md-4">
        <label class="form-label fw-semibold" for="dateFrom">From</label>
        <input id="dateFrom" type="date" th:field="*{dateFrom}" class="form-control form-control-lg">
    </div>
    <div class="col-lg-2 col-md-4">
        <label class="form-label fw-semibold" for="dateTo">To</label>
        <input id="dateTo" type="date" th:field="*{dateTo}" class="form-control form-control-lg">
    </div>
    <div class="col-lg-2 col-md-6">
        <label class="form-label fw-semibold" for="sort">Sort</label>
        <select id="sort" th:field="*{sort}" class="form-select form-select-lg">
            <option value="startsAtAsc">Soonest</option>
            <option value="startsAtDesc">Latest date</option>
            <option value="newest">Newest</option>
        </select>
    </div>
    <div class="col-lg-3 col-md-6 d-grid d-sm-flex gap-2">
        <button type="submit" class="btn btn-primary btn-lg px-4">Search</button>
        <a th:href="@{/events}" class="btn btn-outline-secondary btn-lg">Reset</a>
    </div>
    </div>
</form>
</body>
</html>
