<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="messages">
<body>
<div th:if="${successMessage}" class="alert alert-success multievent-alert" role="alert" th:text="${successMessage}">
    Success message
</div>
<div th:if="${errorMessage}" class="alert alert-danger multievent-alert" role="alert" th:text="${errorMessage}">
    Error message
</div>
</body>
</html>
