<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="orderStatusBadge(status)">
<body>
<span class="badge multievent-status"
      th:classappend="${status == 'PENDING_PAYMENT' || status == 'REFUND_PENDING'} ? 'multievent-status-warning' : (${status == 'PAID'} ? 'multievent-status-success' : (${status == 'CANCELLED' || status == 'EXPIRED'} ? 'multievent-status-danger' : 'multievent-status-muted'))"
      th:text="${status}">
    Status
</span>
</body>
</html>
