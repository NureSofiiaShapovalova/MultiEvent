<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="eventCard(event)">
<body>
<article class="multievent-event-card h-100 d-flex flex-column">
    <div class="multievent-event-card-media">
        <img class="multievent-event-card-image" th:if="${event.coverImageUrl()}" th:src="${event.coverImageUrl()}" th:alt="${event.title()}">
        <div class="multievent-event-card-placeholder" th:unless="${event.coverImageUrl()}">MultiEvent</div>
        <span class="multievent-event-date-pill" th:text="${#temporals.format(event.startsAt(), 'dd MMM HH:mm')}">Date</span>
    </div>
    <div class="card-body d-flex flex-column p-4">
        <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
            <span class="multievent-badge multievent-badge-soft px-3 py-2" th:text="${event.categoryName()}">Category</span>
            <span class="small multievent-muted fw-semibold text-end" th:text="${#temporals.format(event.startsAt(), 'yyyy')}">Year</span>
        </div>
        <h3 class="h5 multievent-card-title fw-bold mb-2" th:text="${event.title()}">Event title</h3>
        <p class="card-text multievent-muted mb-4" th:text="${event.shortDescription()}">Short description</p>
        <div class="mt-auto d-flex justify-content-between align-items-center gap-3">
            <span class="small multievent-muted fw-semibold text-truncate" th:text="${event.venueCity()}">City</span>
            <a class="btn btn-sm btn-primary px-3" th:href="@{/events/{slug}(slug=${event.slug()})}">View details</a>
        </div>
    </div>
</article>
</body>
</html>
