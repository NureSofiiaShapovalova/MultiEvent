<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Events - MultiEvent</title>
</head>
<body>
<section>
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
        <div>
            <p class="multievent-section-kicker mb-1">Browse MultiEvent</p>
            <h1 class="h2 fw-bold mb-2">Events</h1>
            <p class="text-body-secondary mb-0">Search by keyword, category, city, date, and sort order.</p>
        </div>
        <div class="badge rounded-pill text-bg-light border px-3 py-2" th:text="|${events.totalElements} events found|">0 events found</div>
    </div>

    <div th:replace="~{fragments/filter-form :: filterForm(${searchForm}, ${categories})}"></div>

    <div th:if="${events.empty}" class="multievent-empty-state text-center p-5">
        <div class="multievent-empty-mark mb-3">EF</div>
        <h2 class="h5 fw-semibold mb-2">No events match your filters</h2>
        <p class="text-body-secondary mb-4">Try another keyword, city, date range, or category.</p>
        <a th:href="@{/events}" class="btn btn-outline-primary">Reset filters</a>
    </div>

    <div th:if="${!events.empty}" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4 mb-4">
        <div class="col" th:each="event : ${events.content}">
            <div th:replace="~{fragments/event-card :: eventCard(${event})}"></div>
        </div>
    </div>

    <div th:replace="~{fragments/pagination :: pagination(${events}, ${searchForm})}"></div>
</section>
</body>
</html>
