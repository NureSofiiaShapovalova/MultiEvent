<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Edit Event - MultiEvent</title>
</head>
<body>
<section>
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
        <div>
            <h1 class="h3 fw-bold mb-1">Edit event</h1>
            <p class="text-body-secondary mb-0">Update event details and keep the public listing accurate.</p>
        </div>
        <div th:replace="~{organizer/events/_status-badge :: statusBadge(${eventStatus})}"></div>
    </div>
    <form th:action="@{/organizer/events/{eventId}(eventId=${eventId})}" th:object="${eventForm}" method="post" class="bg-white border rounded-4 shadow-sm p-3 p-md-4">
        <div th:replace="~{organizer/events/_form :: eventFields(${categories}, 'Save changes')}"></div>
    </form>
</section>
</body>
</html>
