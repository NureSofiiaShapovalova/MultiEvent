<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Create Event - MultiEvent</title>
</head>
<body>
<section>
    <div class="mb-4">
        <h1 class="h3 fw-bold mb-1">Create event</h1>
        <p class="text-body-secondary mb-0">Fill in the public event details, venue, schedule, and images.</p>
    </div>
    <form th:action="@{/organizer/events}" th:object="${eventForm}" method="post" class="bg-white border rounded-4 shadow-sm p-3 p-md-4">
        <div th:replace="~{organizer/events/_form :: eventFields(${categories}, 'Create event')}"></div>
    </form>
</section>
</body>
</html>
