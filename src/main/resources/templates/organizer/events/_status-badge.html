<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="statusBadge(status)">
<body>
<span th:switch="${status != null ? status.name() : ''}">
    <span th:case="'DRAFT'" class="multievent-status multievent-status-muted">Draft</span>
    <span th:case="'REVIEW'" class="multievent-status multievent-status-warning">Review</span>
    <span th:case="'PUBLISHED'" class="multievent-status multievent-status-success">Published</span>
    <span th:case="'CANCELLED'" class="multievent-status multievent-status-danger">Cancelled</span>
    <span th:case="'FINISHED'" class="multievent-status multievent-status-muted">Finished</span>
    <span th:case="*" class="multievent-status multievent-status-muted">Unknown</span>
</span>
</body>
</html>
