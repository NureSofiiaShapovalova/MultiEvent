<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>My Events - EventFlow</title>
</head>
<body>
<section>
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
        <div>
            <h1 class="h3 fw-bold mb-1">My events</h1>
            <p class="text-body-secondary mb-0">Manage drafts, published listings, and event lifecycle actions.</p>
        </div>
        <a th:href="@{/organizer/events/new}" class="btn btn-primary">Create event</a>
    </div>

    <div th:if="${events.empty}" class="bg-white border rounded-4 shadow-sm text-center p-5">
        <h2 class="h5 fw-semibold mb-2">You have not created any events yet</h2>
        <p class="text-body-secondary mb-4">Start with a draft event, then add tickets and publish it when ready.</p>
        <a th:href="@{/organizer/events/new}" class="btn btn-primary">Create event</a>
    </div>

    <div th:if="${!events.empty}" class="table-responsive border rounded-4 shadow-sm bg-white">
            <table class="table align-middle mb-0 eventflow-data-table">
            <thead class="table-light">
            <tr>
                <th>Event</th>
                <th>Status</th>
                <th>Schedule</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="event : ${events.content}">
                <td>
                    <div class="fw-semibold" th:text="${event.title()}">Title</div>
                    <div class="text-body-secondary small" th:text="${event.categoryName() + ' - ' + event.city()}">Category - City</div>
                </td>
                <td><span th:replace="~{organizer/events/_status-badge :: statusBadge(${event.status()})}"></span></td>
                <td class="small text-body-secondary">
                    <div th:text="${event.startsAt()}">Starts</div>
                    <div th:text="${event.endsAt()}">Ends</div>
                </td>
                <td class="text-end">
                    <div class="d-grid d-sm-inline-flex gap-1" aria-label="Event actions">
                        <a th:href="@{/organizer/events/{eventId}/edit(eventId=${event.id()})}" class="btn btn-sm btn-outline-secondary">Edit</a>
                        <form th:if="${event.status().name() != 'PUBLISHED' && event.status().name() != 'CANCELLED'}" th:action="@{/organizer/events/{eventId}/publish(eventId=${event.id()})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-sm btn-outline-primary w-100">Publish</button>
                        </form>
                        <form th:if="${event.status().name() != 'CANCELLED'}" th:action="@{/organizer/events/{eventId}/cancel(eventId=${event.id()})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-sm btn-outline-danger w-100">Cancel</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
