<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="${order.eventTitle() + ' - Refund Request - EventFlow'}">Refund Request - EventFlow</title>
</head>
<body>
<section class="mx-auto" style="max-width: 760px;">
    <div class="mb-4">
        <a class="btn btn-outline-secondary btn-sm mb-3" th:href="@{/orders/{orderId}(orderId=${order.orderId()})}">Back to order</a>
        <h1 class="h3 mb-2">Request a refund</h1>
        <p class="text-body-secondary mb-0" th:text="${order.eventTitle()}">Event title</p>
    </div>

    <div class="bg-white border rounded-4 shadow-sm p-3 p-md-4">
        <div class="d-flex justify-content-between flex-wrap gap-3 mb-4">
            <div>
                <div class="fw-semibold">Order status</div>
                <div class="mt-1" th:replace="~{fragments/order-status-badge :: orderStatusBadge(${order.status()})}"></div>
            </div>
            <div class="text-sm-end">
                <div class="h5 mb-1" th:text="${order.totalAmount() + ' ' + order.currency()}">Total</div>
                <div class="small text-body-secondary" th:text="${'Order #' + order.orderId()}">Order</div>
            </div>
        </div>

        <form th:action="@{/orders/{orderId}/refund-request(orderId=${order.orderId()})}"
              th:object="${refundRequestForm}"
              method="post"
              novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-3">
                <label for="reason" class="form-label">Refund reason</label>
                <textarea id="reason"
                          th:field="*{reason}"
                          class="form-control"
                          th:classappend="${#fields.hasErrors('reason')} ? ' is-invalid'"
                          rows="5"
                          maxlength="1000"
                          required
                          aria-describedby="reasonHelp reasonError"></textarea>
                <div id="reasonHelp" class="form-text">Explain why you want to request a refund. The organizer/admin will review it.</div>
                <div id="reasonError" class="invalid-feedback" th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}">Reason error</div>
            </div>

            <div class="d-flex flex-column flex-sm-row gap-2 justify-content-end">
                <a class="btn btn-outline-secondary" th:href="@{/orders/{orderId}(orderId=${order.orderId()})}">Cancel</a>
                <button type="submit" class="btn btn-primary">Submit refund request</button>
            </div>
        </form>
    </div>
</section>
</body>
</html>
