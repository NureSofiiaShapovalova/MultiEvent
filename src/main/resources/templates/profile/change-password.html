<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="#{profile.password.pageTitle}">Change password - MultiEvent</title>
</head>
<body>
<section class="mx-auto" style="max-width: 720px;">
    <div class="mb-4">
        <h1 class="h3 fw-bold mb-1" th:text="#{profile.password.title}">Change password</h1>
        <p class="text-body-secondary mb-0" th:text="#{profile.password.subtitle}">Update the password used to sign in to your account.</p>
    </div>

    <form th:action="@{/profile/password}" th:object="${changePasswordForm}" method="post" class="bg-white border rounded-4 shadow-sm p-3 p-md-4 vstack gap-3">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger multievent-alert" role="alert">
            <div class="fw-semibold" th:text="#{profile.password.validationTitle}">Please check the highlighted fields.</div>
            <div th:text="#{profile.password.validationText}">Some password information is missing or invalid.</div>
        </div>

        <div>
            <label for="currentPassword" class="form-label fw-semibold" th:text="#{profile.password.current}">Current password</label>
            <div class="input-group">
                <input id="currentPassword" type="password" th:field="*{currentPassword}" class="form-control" th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'" autocomplete="current-password" required>
                <button type="button"
                        class="btn btn-outline-secondary multievent-password-toggle"
                        data-password-toggle
                        data-password-toggle-target="currentPassword"
                        th:attr="aria-label=#{auth.password.show},title=#{auth.password.show},data-show-label=#{auth.password.show},data-hide-label=#{auth.password.hide}">
                    <svg class="multievent-password-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <span class="visually-hidden" th:text="#{auth.password.show}">Show password</span>
                </button>
            </div>
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}">Current password error</div>
        </div>

        <div>
            <label for="newPassword" class="form-label fw-semibold" th:text="#{profile.password.new}">New password</label>
            <div class="input-group">
                <input id="newPassword" type="password" th:field="*{newPassword}" class="form-control" th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'" autocomplete="new-password" required>
                <button type="button"
                        class="btn btn-outline-secondary multievent-password-toggle"
                        data-password-toggle
                        data-password-toggle-target="newPassword"
                        th:attr="aria-label=#{auth.password.show},title=#{auth.password.show},data-show-label=#{auth.password.show},data-hide-label=#{auth.password.hide}">
                    <svg class="multievent-password-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <span class="visually-hidden" th:text="#{auth.password.show}">Show password</span>
                </button>
            </div>
            <div class="form-text" th:text="#{profile.password.help}">Use at least 8 characters.</div>
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}">New password error</div>
        </div>

        <div>
            <label for="confirmPassword" class="form-label fw-semibold" th:text="#{profile.password.confirm}">Confirm new password</label>
            <div class="input-group">
                <input id="confirmPassword" type="password" th:field="*{confirmPassword}" class="form-control" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'" autocomplete="new-password" required>
                <button type="button"
                        class="btn btn-outline-secondary multievent-password-toggle"
                        data-password-toggle
                        data-password-toggle-target="confirmPassword"
                        th:attr="aria-label=#{auth.password.show},title=#{auth.password.show},data-show-label=#{auth.password.show},data-hide-label=#{auth.password.hide}">
                    <svg class="multievent-password-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <span class="visually-hidden" th:text="#{auth.password.show}">Show password</span>
                </button>
            </div>
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Password confirmation error</div>
        </div>

        <div class="d-grid d-sm-flex gap-2">
            <button type="submit" class="btn btn-primary" th:text="#{profile.password.submit}">Save password</button>
            <a th:href="@{/profile}" class="btn btn-outline-secondary" th:text="#{profile.password.cancel}">Cancel</a>
        </div>
    </form>
</section>
</body>
</html>
