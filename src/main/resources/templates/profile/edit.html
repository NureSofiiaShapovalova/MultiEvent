<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Edit Profile - MultiEvent</title>
</head>
<body>
<section class="mx-auto" style="max-width: 720px;">
        <div class="mb-4">
            <h1 class="h3 fw-bold mb-1">Edit profile</h1>
            <p class="text-body-secondary mb-0">Keep your attendee profile and contact details up to date.</p>
        </div>

        <form th:action="@{/profile/edit}" th:object="${profileEditForm}" method="post" class="bg-white border rounded-4 shadow-sm p-3 p-md-4 row g-3">
            <div class="col-md-6">
                <label for="firstName" class="form-label fw-semibold">First name</label>
                <input id="firstName" type="text" th:field="*{firstName}" class="form-control" th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'" autocomplete="given-name">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}">First name error</div>
            </div>
            <div class="col-md-6">
                <label for="lastName" class="form-label fw-semibold">Last name</label>
                <input id="lastName" type="text" th:field="*{lastName}" class="form-control" th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'" autocomplete="family-name">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}">Last name error</div>
            </div>
            <div class="col-md-6">
                <label for="phoneNumber" class="form-label fw-semibold">Phone</label>
                <input id="phoneNumber" type="text" th:field="*{phoneNumber}" class="form-control" th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid'" autocomplete="tel">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}">Phone error</div>
            </div>
            <div class="col-md-6">
                <label for="city" class="form-label fw-semibold">City</label>
                <input id="city" type="text" th:field="*{city}" class="form-control" th:classappend="${#fields.hasErrors('city')} ? 'is-invalid'" autocomplete="address-level2">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('city')}" th:errors="*{city}">City error</div>
            </div>
            <div class="col-12">
                <label for="bio" class="form-label fw-semibold">Bio</label>
                <textarea id="bio" th:field="*{bio}" class="form-control" th:classappend="${#fields.hasErrors('bio')} ? 'is-invalid'" rows="4"></textarea>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('bio')}" th:errors="*{bio}">Bio error</div>
            </div>
            <div class="col-12 d-grid d-sm-flex gap-2">
                <button type="submit" class="btn btn-primary">Save profile</button>
                <a th:href="@{/profile}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
</section>
</body>
</html>
