<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="notificationFields">
<body>
<div class="mb-3 form-check form-switch">
    <input class="form-check-input"
           type="checkbox"
           th:field="*{emailEnabled}"
           th:classappend="${#fields.hasErrors('emailEnabled')} ? 'is-invalid'">
    <label class="form-check-label" for="emailEnabled">Email notifications</label>
    <div class="form-text">Allow MultiEvent to send email notifications.</div>
    <div class="invalid-feedback" th:if="${#fields.hasErrors('emailEnabled')}" th:errors="*{emailEnabled}">Email notification error</div>
</div>

<div class="mb-3 form-check form-switch">
    <input class="form-check-input"
           type="checkbox"
           th:field="*{orderUpdatesEnabled}"
           th:classappend="${#fields.hasErrors('orderUpdatesEnabled')} ? 'is-invalid'">
    <label class="form-check-label" for="orderUpdatesEnabled">Order updates</label>
    <div class="form-text">Receive receipts, payment updates, and cancellation notices.</div>
    <div class="invalid-feedback" th:if="${#fields.hasErrors('orderUpdatesEnabled')}" th:errors="*{orderUpdatesEnabled}">Order update error</div>
</div>

<div class="mb-3 form-check form-switch">
    <input class="form-check-input"
           type="checkbox"
           th:field="*{marketingEnabled}"
           th:classappend="${#fields.hasErrors('marketingEnabled')} ? 'is-invalid'">
    <label class="form-check-label" for="marketingEnabled">Marketing emails</label>
    <div class="form-text">Keep this on if you want future campaign emails.</div>
    <div class="invalid-feedback" th:if="${#fields.hasErrors('marketingEnabled')}" th:errors="*{marketingEnabled}">Marketing email error</div>
</div>
</body>
</html>
