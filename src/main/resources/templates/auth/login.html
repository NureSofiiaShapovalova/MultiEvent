<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Login - EventFlow</title>
</head>
<body>
<section class="row justify-content-center py-4 py-lg-5">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        <div class="eventflow-soft-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="eventflow-brand-mark mx-auto mb-3" aria-hidden="true">E</div>
                <h1 class="h3 fw-bold mb-2">Welcome back</h1>
                <p class="eventflow-muted mb-0">Sign in to manage events, orders, and tickets.</p>
            </div>

            <div th:if="${param.error}" class="alert alert-danger eventflow-alert" role="alert">
                <div class="fw-semibold">Could not sign you in.</div>
                <div>Check your email and password, then try again.</div>
            </div>
            <div th:if="${param.logout}" class="alert alert-success eventflow-alert" role="alert">
                You have been logged out.
            </div>

            <form th:action="@{/login}" method="post" class="vstack gap-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div>
                    <label for="username" class="form-label fw-semibold">Email</label>
                    <input id="username" name="username" type="email" class="form-control form-control-lg" autocomplete="username" required>
                </div>
                <div>
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <input id="password" name="password" type="password" class="form-control form-control-lg" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">Login</button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <span class="eventflow-muted">No account yet?</span>
                <a th:href="@{/register}" class="fw-semibold">Create one</a>
            </div>
        </div>
    </div>
</section>
</body>
</html>
