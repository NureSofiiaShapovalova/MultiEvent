<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="${reservation.ticketName() + ' - Reservation - EventFlow'}">Reservation - EventFlow</title>
</head>
<body>
<section class="mx-auto" style="max-width: 760px;">
    <div class="mb-4">
        <h1 class="h3 mb-2" th:text="${reservation.eventTitle()}">Event title</h1>
        <p class="text-body-secondary mb-0" th:text="${'Reservation #' + reservation.reservationId()}">Reservation</p>
    </div>

    <div class="bg-white border rounded-4 shadow-sm p-3 p-md-4 mb-3">
        <div class="d-flex justify-content-between gap-3 flex-wrap">
            <div>
                <div class="fw-semibold" th:text="${reservation.ticketName()}">Ticket name</div>
                <div class="text-body-secondary small" th:text="${reservation.description()}">Description</div>
            </div>
            <div class="text-end">
                <div class="h5 mb-1" th:text="${reservation.totalPrice() + ' ' + reservation.currency()}">Total</div>
                <div class="small text-body-secondary" th:text="${'Status: ' + reservation.status()}">Status</div>
                <div class="small text-body-secondary" th:text="${'Expires: ' + reservation.expiresAt()}">Expires</div>
            </div>
        </div>
    </div>

    <div class="bg-white border rounded-4 shadow-sm p-3 p-md-4">
        <h2 class="h5 fw-bold mb-3">Update reservation</h2>
        <form th:action="@{/checkout/reservations/{reservationId}/quantity(reservationId=${reservation.reservationId()})}" th:object="${checkoutForm}" method="post" class="row g-3 mb-3" th:if="${reservation.status() == 'PENDING'}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="col-md-4">
                <label for="quantity" class="form-label fw-semibold">Quantity</label>
                <input id="quantity" type="number" min="1" th:field="*{quantity}" class="form-control" th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}">Quantity error</div>
            </div>
            <div class="col-12 d-grid d-sm-flex">
                <button type="submit" class="btn btn-outline-primary">Update quantity</button>
            </div>
        </form>

        <div class="d-grid d-sm-flex gap-2" th:if="${reservation.status() == 'PENDING'}">
            <form th:action="@{/checkout/reservations/{reservationId}/confirm(reservationId=${reservation.reservationId()})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-success w-100">Confirm purchase</button>
            </form>
            <form th:action="@{/checkout/reservations/{reservationId}/release(reservationId=${reservation.reservationId()})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-outline-danger w-100">Release reservation</button>
            </form>
        </div>
    </div>
</section>
</body>
</html>
