<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="${checkoutView.ticketName() + ' - Checkout - MultiEvent'}">Checkout - MultiEvent</title>
</head>
<body>
<section class="mx-auto" style="max-width: 760px;">
    <div class="mb-4">
        <h1 class="h3 mb-2" th:text="${checkoutView.eventTitle()}">Event title</h1>
        <p class="text-body-secondary mb-0" th:text="${checkoutView.ticketName()}">Ticket name</p>
    </div>

    <div class="bg-white border rounded-4 shadow-sm p-3 p-md-4">
        <div class="d-flex justify-content-between flex-wrap gap-3 mb-3">
            <div>
                <div class="fw-semibold" th:text="${checkoutView.ticketName()}">Ticket name</div>
                <div class="text-body-secondary small" th:text="${checkoutView.description()}">Description</div>
            </div>
            <div class="text-end">
                <div class="h5 mb-1" th:text="${checkoutView.price() + ' ' + checkoutView.currency()}">Price</div>
                <div class="small text-body-secondary" th:text="${checkoutView.availabilityLabel()}">Availability</div>
            </div>
        </div>

        <form th:action="@{/checkout/events/{slug}/tickets/{ticketTypeId}(slug=${checkoutView.eventSlug()}, ticketTypeId=${checkoutView.ticketTypeId()})}" th:object="${checkoutForm}" method="post" class="row g-3">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="col-md-6">
                <label for="quantity" class="form-label fw-semibold">Quantity</label>
                <input id="quantity" type="number" min="1" th:field="*{quantity}" class="form-control" th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}">Quantity error</div>
            </div>
            <div class="col-md-6 d-flex align-items-end">
                <div class="text-body-secondary small">
                    <div th:text="${'Max per order: ' + checkoutView.maxPerOrder()}">Max per order</div>
                    <div th:text="${'Available: ' + checkoutView.availableQuantity()}">Available</div>
                </div>
            </div>
            <div class="col-12 d-grid d-sm-flex">
                <button type="submit" class="btn btn-primary">Reserve ticket</button>
            </div>
        </form>
    </div>
</section>
</body>
</html>
