<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="${summary.eventTitle() + ' - Order Summary - MultiEvent'}">Order Summary - MultiEvent</title>
</head>
<body>
<section class="mx-auto" style="max-width: 960px;">
    <div class="mb-4">
        <h1 class="h3 mb-2" th:text="${summary.eventTitle()}">Event title</h1>
        <p class="text-body-secondary mb-0" th:text="${'Order #' + summary.orderId()}">Order</p>
    </div>

    <div class="bg-white border rounded-4 shadow-sm p-3 p-md-4 mb-3">
        <div class="d-flex justify-content-between flex-wrap gap-3 mb-3">
            <div>
                <div class="fw-semibold">Order summary</div>
                <div class="text-body-secondary small" th:text="${summary.paymentStepLabel()}">Payment step pending</div>
            </div>
            <div class="text-sm-end">
                <div class="h5 mb-1" th:text="${summary.totalAmount() + ' ' + summary.currency()}">Total</div>
                <div class="small text-body-secondary" th:text="${'Status: ' + summary.status()}">Status</div>
                <div class="small text-body-secondary" th:text="${'Expires: ' + summary.expiresAt()}">Expires</div>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th scope="col">Ticket</th>
                    <th scope="col" class="text-end">Qty</th>
                    <th scope="col" class="text-end">Unit</th>
                    <th scope="col" class="text-end">Line total</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${summary.items()}">
                    <td>
                        <div class="fw-semibold" th:text="${item.ticketName()}">Ticket</div>
                    </td>
                    <td class="text-end" th:text="${item.quantity()}">1</td>
                    <td class="text-end" th:text="${item.unitPrice() + ' ' + item.currency()}">25 USD</td>
                    <td class="text-end" th:text="${item.lineTotal() + ' ' + item.currency()}">25 USD</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="d-grid d-sm-flex justify-content-sm-end">
            <form th:action="@{/checkout/orders/{orderId}/confirm(orderId=${summary.orderId()})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-primary w-100">Continue to payment</button>
            </form>
        </div>
    </div>
</section>
</body>
</html>
