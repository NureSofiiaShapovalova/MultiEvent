<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="${payment.eventTitle() + ' - Payment Result - EventFlow'}">Payment Result - EventFlow</title>
</head>
<body>
<section class="mx-auto" style="max-width: 960px;">
    <div class="mb-4">
        <h1 class="h3 mb-2" th:text="${payment.eventTitle()}">Event title</h1>
        <p class="text-body-secondary mb-0" th:text="${'Payment #' + payment.paymentId()}">Payment</p>
    </div>

    <div class="bg-white border rounded-4 shadow-sm p-3 p-md-4 mb-3">
        <div class="d-flex justify-content-between flex-wrap gap-3 mb-3">
            <div>
                <div class="fw-semibold">Result</div>
                <div class="mt-1" th:replace="~{fragments/payment-status-badge :: paymentStatusBadge(${payment.paymentStatus()})}"></div>
            </div>
            <div class="text-sm-end">
                <div class="h5 mb-1" th:text="${payment.totalAmount() + ' ' + payment.currency()}">Total</div>
                <div class="small text-body-secondary" th:text="${'Order status: ' + payment.orderStatus()}">Order status</div>
                <div class="small text-body-secondary" th:if="${payment.completedAt()}" th:text="${'Completed: ' + payment.completedAt()}">Completed</div>
            </div>
        </div>

        <div class="alert"
             th:classappend="${payment.paymentStatus() == 'PAID'} ? 'alert-success' : (${payment.paymentStatus() == 'FAILED'} ? 'alert-danger' : 'alert-info')"
             role="alert"
             th:text="${payment.message()}">Payment message</div>

        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th scope="col">Ticket</th>
                    <th scope="col" class="text-end">Qty</th>
                    <th scope="col" class="text-end">Unit</th>
                    <th scope="col" class="text-end">Line total</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${payment.items()}">
                    <td th:text="${item.ticketName()}">Ticket</td>
                    <td class="text-end" th:text="${item.quantity()}">1</td>
                    <td class="text-end" th:text="${item.unitPrice() + ' ' + item.currency()}">25 USD</td>
                    <td class="text-end" th:text="${item.lineTotal() + ' ' + item.currency()}">25 USD</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <div class="small text-body-secondary">Provider</div>
                <div class="fw-semibold" th:text="${payment.providerName()}">LOCAL_MANUAL</div>
            </div>
            <div class="col-md-6">
                <div class="small text-body-secondary">Reference</div>
                <div class="fw-semibold text-break" th:text="${payment.providerReference()}">local-ref</div>
            </div>
            <div class="col-md-6">
                <div class="small text-body-secondary">Started</div>
                <div th:text="${payment.startedAt()}">2026-08-15T00:00:00Z</div>
            </div>
            <div class="col-md-6">
                <div class="small text-body-secondary">Attempts</div>
                <div th:text="${payment.attemptCount()}">1</div>
            </div>
        </div>

        <div class="d-grid d-sm-flex gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/checkout/orders/{orderId}/summary(orderId=${payment.orderId()})}">Back to summary</a>
            <a class="btn btn-primary" th:if="${payment.paymentStatus() == 'PAID'}" th:href="@{/orders/{orderId}(orderId=${payment.orderId()})}">View order</a>
            <form th:if="${payment.canRetry()}" th:action="@{/checkout/orders/{orderId}/payment/retry(orderId=${payment.orderId()})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-outline-primary w-100">Retry payment</button>
            </form>
        </div>
    </div>
</section>
</body>
</html>
