<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Create Category - Admin - MultiEvent</title>
</head>
<body>
<section class="mx-auto" style="max-width: 720px;">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
        <div>
            <h1 class="h3 fw-bold mb-1">Create category</h1>
            <p class="text-body-secondary mb-0">Add a public category for organizing event listings.</p>
        </div>
        <a th:href="@{/admin/categories}" class="btn btn-outline-secondary">Back</a>
    </div>
    <div class="bg-white border rounded-4 shadow-sm p-3 p-md-4">
        <form th:action="@{/admin/categories}" th:object="${categoryForm}" method="post">
            <div th:replace="~{admin/categories/_form :: categoryFields}"></div>
            <div class="d-grid d-sm-flex justify-content-sm-end">
                <button type="submit" class="btn btn-primary">Create</button>
            </div>
        </form>
    </div>
</section>
</body>
</html>
