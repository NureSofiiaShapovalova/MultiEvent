<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Categories - Admin - MultiEvent</title>
</head>
<body>
<section>
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
        <div>
            <h1 class="h3 fw-bold mb-1">Categories</h1>
            <p class="text-body-secondary mb-0">Maintain public catalog category names and slugs.</p>
        </div>
        <div class="d-grid d-sm-flex gap-2">
            <a th:href="@{/admin}" class="btn btn-outline-secondary">Dashboard</a>
            <a th:href="@{/admin/categories/new}" class="btn btn-primary">Add category</a>
        </div>
    </div>

    <div th:if="${categories.isEmpty()}" class="bg-white border rounded-4 shadow-sm text-center p-5">
        <h2 class="h5 fw-semibold mb-2">No categories found</h2>
        <p class="text-body-secondary mb-4">Create categories so organizers can classify events.</p>
        <a th:href="@{/admin/categories/new}" class="btn btn-primary">Add category</a>
    </div>

    <div th:if="${!categories.isEmpty()}" class="table-responsive border rounded-4 shadow-sm bg-white">
        <table class="table align-middle mb-0 multievent-data-table">
            <thead class="table-light">
            <tr>
                <th>Name</th>
                <th>Slug</th>
                <th>Events</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="category : ${categories}">
                <td class="fw-semibold" th:text="${category.name()}">Concerts</td>
                <td th:text="${category.slug()}">concerts</td>
                <td th:text="${category.eventCount()}">0</td>
                <td class="text-end">
                    <a th:href="@{/admin/categories/{categoryId}/edit(categoryId=${category.id()})}" class="btn btn-sm btn-outline-secondary">Edit</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
