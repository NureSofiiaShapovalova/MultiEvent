<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Events - Admin - MultiEvent</title>
</head>
<body>
<section>
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
        <div>
            <h1 class="h3 fw-bold mb-1">Events</h1>
            <p class="text-body-secondary mb-0">Moderate event visibility and review organizer submissions.</p>
        </div>
        <a th:href="@{/admin}" class="btn btn-outline-secondary">Dashboard</a>
    </div>

    <div th:if="${events.isEmpty()}" class="bg-white border rounded-4 shadow-sm text-center p-5">
        <h2 class="h5 fw-semibold mb-2">No events found</h2>
        <p class="text-body-secondary mb-0">Organizer events will appear here when they are created.</p>
    </div>

    <div th:if="${!events.isEmpty()}" class="table-responsive border rounded-4 shadow-sm bg-white">
        <table class="table align-middle mb-0 multievent-data-table">
            <thead class="table-light">
            <tr>
                <th>Event</th>
                <th>Status</th>
                <th>When</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="event : ${events}">
                <td>
                    <div class="fw-semibold" th:text="${event.title()}">Title</div>
                    <div class="text-body-secondary small" th:text="${event.categoryName() + ' - ' + event.organizerEmail()}">Category - Organizer</div>
                    <div class="text-body-secondary small" th:text="${event.city()}">City</div>
                </td>
                <td><span th:replace="~{organizer/events/_status-badge :: statusBadge(${event.status()})}"></span></td>
                <td class="small text-body-secondary">
                    <div th:text="${event.startsAt()}">Starts</div>
                    <div th:text="${event.endsAt()}">Ends</div>
                </td>
                <td class="text-end">
                    <form th:if="${event.status().name() != 'PUBLISHED' && event.status().name() != 'CANCELLED'}" th:action="@{/admin/events/{eventId}/moderate(eventId=${event.id()})}" method="post" class="d-flex flex-column flex-sm-row justify-content-end gap-1 align-items-stretch align-items-sm-center mb-1">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="action" value="PUBLISH">
                        <input type="text" name="reason" class="form-control form-control-sm" placeholder="Reason" aria-label="Publish reason">
                        <button type="submit" class="btn btn-sm btn-outline-primary">Publish</button>
                    </form>
                    <form th:if="${event.status().name() != 'CANCELLED'}" th:action="@{/admin/events/{eventId}/moderate(eventId=${event.id()})}" method="post" class="d-flex flex-column flex-sm-row justify-content-end gap-1 align-items-stretch align-items-sm-center">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="action" value="CANCEL">
                        <input type="text" name="reason" class="form-control form-control-sm" placeholder="Reason" aria-label="Cancel reason">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Cancel</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
