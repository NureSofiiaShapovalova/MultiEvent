<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Users - Admin - EventFlow</title>
</head>
<body>
<section>
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
        <div>
            <h1 class="h3 fw-bold mb-1">Users</h1>
            <p class="text-body-secondary mb-0">Inspect accounts, lock access, and manage organizer privileges.</p>
        </div>
        <a th:href="@{/admin}" class="btn btn-outline-secondary">Dashboard</a>
    </div>

    <div th:if="${users.isEmpty()}" class="bg-white border rounded-4 shadow-sm text-center p-5">
        <h2 class="h5 fw-semibold mb-2">No users found</h2>
        <p class="text-body-secondary mb-0">Registered EventFlow users will appear here.</p>
    </div>

    <div th:if="${!users.isEmpty()}" class="table-responsive border rounded-4 shadow-sm bg-white">
        <table class="table align-middle mb-0 eventflow-data-table">
            <thead class="table-light">
            <tr>
                <th>User</th>
                <th>Status</th>
                <th>Roles</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td>
                    <div class="fw-semibold" th:text="${user.email()}">user@example.com</div>
                    <div class="text-body-secondary small" th:text="${(user.firstName() ?: '') + ' ' + (user.lastName() ?: '')}">Name</div>
                    <div class="text-body-secondary small" th:text="${user.city() ?: 'Not specified'}">City</div>
                </td>
                <td class="small text-body-secondary">
                    <span class="badge rounded-pill me-1" th:classappend="${user.enabled()} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${user.enabled() ? 'Enabled' : 'Disabled'}">Enabled</span>
                    <span class="badge rounded-pill" th:classappend="${user.accountNonLocked()} ? 'text-bg-light text-dark border' : 'text-bg-warning'" th:text="${user.accountNonLocked() ? 'Unlocked' : 'Locked'}">Unlocked</span>
                </td>
                <td>
                    <span th:each="role : ${user.roles()}" class="badge rounded-pill text-bg-secondary me-1" th:text="${role.name()}">ROLE_USER</span>
                </td>
                <td class="text-end">
                    <div class="d-grid d-sm-inline-flex gap-1" aria-label="User actions">
                        <form th:if="${user.accountNonLocked()}" th:action="@{/admin/users/{userId}/lock(userId=${user.id()})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-sm btn-outline-warning w-100">Lock</button>
                        </form>
                        <form th:if="${!user.accountNonLocked()}" th:action="@{/admin/users/{userId}/unlock(userId=${user.id()})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-sm btn-outline-success w-100">Unlock</button>
                        </form>
                        <form th:if="${!user.roles().contains(T(nure.com.eventflow.iam.domain.RoleName).ROLE_ORGANIZER)}" th:action="@{/admin/users/{userId}/grant-organizer(userId=${user.id()})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-sm btn-outline-primary w-100">Grant organizer</button>
                        </form>
                        <form th:if="${user.roles().contains(T(nure.com.eventflow.iam.domain.RoleName).ROLE_ORGANIZER)}" th:action="@{/admin/users/{userId}/revoke-organizer(userId=${user.id()})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-sm btn-outline-danger w-100">Revoke organizer</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
