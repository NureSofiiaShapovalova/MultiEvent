spring:
  datasource:
    url: ${MULTIEVENT_DB_URL:jdbc:postgresql://db:5432/multievent}
    username: ${MULTIEVENT_DB_USERNAME:multievent}
    password: ${MULTIEVENT_DB_PASSWORD:multievent_dev_password}
  mail:
    host: ${MULTIEVENT_MAIL_HOST:mailpit}
    port: ${MULTIEVENT_MAIL_PORT:1025}
    username: ${MULTIEVENT_MAIL_USERNAME:}
    password: ${MULTIEVENT_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MULTIEVENT_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MULTIEVENT_MAIL_SMTP_STARTTLS:false}
  jpa:
    show-sql: false
  thymeleaf:
    cache: true

multievent:
  mail:
    from: ${MULTIEVENT_MAIL_FROM:no-reply@multievent.local}

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
