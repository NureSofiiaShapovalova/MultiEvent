spring:
  datasource:
    url: ${MULTIEVENT_DB_URL}
    username: ${MULTIEVENT_DB_USERNAME}
    password: ${MULTIEVENT_DB_PASSWORD}
  mail:
    host: ${MULTIEVENT_MAIL_HOST}
    port: ${MULTIEVENT_MAIL_PORT:587}
    username: ${MULTIEVENT_MAIL_USERNAME}
    password: ${MULTIEVENT_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MULTIEVENT_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MULTIEVENT_MAIL_SMTP_STARTTLS:true}
  jpa:
    show-sql: false
  thymeleaf:
    cache: true

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
        same-site: lax

multievent:
  mail:
    from: ${MULTIEVENT_MAIL_FROM}

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
